# Fallback values used by the Secrets Gradle Plugin when secrets.properties
# is missing (e.g. on a fresh clone or in CI). This file IS committed to git,
# so it must never contain a real key — only a placeholder.
#
# To run the app with a working map, put your real key in secrets.properties
# instead (that file is gitignored and overrides this one):
#   MAPS_API_KEY=your_real_key_here
MAPS_API_KEY=PLACEHOLDER_MAPS_API_KEY
